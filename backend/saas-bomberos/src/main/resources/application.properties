# Configuracion del servidor
server.port=${PORT:8080}

# Configuracion de la base de datos
# Los valores por defecto (tras los ':') son los de desarrollo local;
# en produccion se sobreescriben con variables de entorno reales.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saas_bomberos?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Nombre de la aplicacion
spring.application.name=saas-bomberos

# JWT: si no se define JWT_SECRET, se usa un valor fijo de desarrollo
# (nunca usar ese default en produccion). En Render se define una
# variable de entorno propia para que los tokens sobrevivan a reinicios.
jwt.secret=${JWT_SECRET:dev-secret-no-usar-en-produccion-cambiar-esto-en-render}

# Origenes permitidos por CORS, separados por coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
